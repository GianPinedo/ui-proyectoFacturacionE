<div class="overflow-x-auto">
	<table class="min-w-full border-separate border-spacing-0">
		<thead>
			<tr>
				@for (column of columns; track column.key) {
					<th class="border-b border-border px-4 py-3 text-left text-xs font-semibold uppercase tracking-wide text-muted">
						{{ column.label }}
					</th>
				}
			</tr>
		</thead>
		<tbody>
			@for (row of rows; track $index) {
				<tr>
					@for (column of columns; track column.key) {
						<td class="border-b border-border/70 px-4 py-3 text-sm text-primary">
							@if (column.key === statusColumnKey) {
								<app-status-badge [status]="row[column.key]" />
							} @else {
								{{ row[column.key] }}
							}
						</td>
					}
				</tr>
			} @empty {
				<tr>
					<td class="px-4 py-8 text-center text-sm text-muted" [attr.colspan]="columns.length">{{ emptyLabel }}</td>
				</tr>
			}
		</tbody>
	</table>
</div>
