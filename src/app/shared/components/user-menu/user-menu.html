<div class="relative">
	<button
		class="flex items-center gap-3 rounded-xl border border-transparent px-3 py-2 transition hover:border-border hover:bg-page"
		type="button"
		(click)="onTriggerClick()"
	>
		<div class="flex h-9 w-9 items-center justify-center rounded-full bg-primary text-sm font-semibold text-white">{{ avatarInitials }}</div>
		<div class="hidden text-left md:block">
			<p class="text-sm font-semibold text-primary">{{ displayName }}</p>
			<p class="text-xs text-muted">{{ roleLabel }}</p>
		</div>
		<lucide-angular [img]="chevronDownIcon" [size]="16" class="text-muted" />
	</button>

	@if (isOpen) {
		<div
			class="absolute right-0 z-[120] mt-2 w-52 rounded-xl border border-border bg-white p-2 shadow-lg"
		>
			<button
				class="flex w-full items-center gap-2 rounded-lg px-3 py-2 text-left text-sm text-primary transition hover:bg-page"
				type="button"
				(click)="onProfile()"
			>
				<lucide-angular [img]="userIcon" [size]="16" />
				Mi perfil
			</button>
			<button
				class="flex w-full items-center gap-2 rounded-lg px-3 py-2 text-left text-sm text-primary transition hover:bg-page"
				type="button"
			>
				<lucide-angular [img]="settingsIcon" [size]="16" />
				Configuración
			</button>
			<button
				class="flex w-full items-center gap-2 rounded-lg px-3 py-2 text-left text-sm text-rose-600 transition hover:bg-rose-50"
				type="button"
				(click)="onLogout()"
			>
				<lucide-angular [img]="logoutIcon" [size]="16" />
				Cerrar sesión
			</button>
		</div>
	}
</div>
