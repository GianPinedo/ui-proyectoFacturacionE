<div class="fixed inset-0 z-50 flex items-start justify-center overflow-y-auto bg-black/45 p-4 md:items-center" (click)="close()">
  <div class="my-4 w-full max-w-lg" (click)="$event.stopPropagation()" role="dialog" aria-modal="true" aria-label="Cargar certificado digital">
    <div class="flex flex-col overflow-hidden rounded-3xl border border-border bg-[#EEF2F3] shadow-xl">
      <div class="flex items-start justify-between gap-4 border-b border-slate-200 bg-white px-6 py-5">
        <h3 class="text-xl font-extrabold text-primary">Cargar certificado digital</h3>
        <button type="button" class="inline-flex h-10 w-10 items-center justify-center rounded-xl text-slate-500 transition hover:bg-slate-200" (click)="close()" aria-label="Cerrar" title="Cerrar">
          <lucide-angular [img]="closeIcon" [size]="20" />
        </button>
      </div>

      <form class="grid gap-4 p-6" [formGroup]="form" (ngSubmit)="submit()">
        <label class="flex flex-col gap-2">
          <span class="text-sm font-semibold text-slate-700">Archivo certificado (.pfx o .p12) <span class="text-rose-500">*</span></span>
          <input type="file" accept=".pfx,.p12" (change)="onFileChange($event)" class="rounded-xl border border-border bg-white p-2 text-sm text-primary" />
          @if (selectedFileName()) {
            <span class="text-xs text-muted">{{ selectedFileName() }}</span>
          }
          @if (form.errors?.['fileRequired']) {
            <span class="text-xs text-rose-600">Debes seleccionar un archivo.</span>
          }
          @if (form.errors?.['invalidFileType']) {
            <span class="text-xs text-rose-600">Solo se permiten archivos .pfx o .p12.</span>
          }
          @if (form.errors?.['invalidFileSize']) {
            <span class="text-xs text-rose-600">El archivo no debe superar 5 MB.</span>
          }
        </label>

        <label class="flex flex-col gap-2">
          <span class="text-sm font-semibold text-slate-700">Clave del certificado <span class="text-rose-500">*</span></span>
          <input type="password" formControlName="clave" class="h-11 rounded-xl border border-border bg-white px-4 text-sm text-primary outline-none transition focus:border-accent" />
        </label>

        <label class="flex flex-col gap-2">
          <span class="text-sm font-semibold text-slate-700">Confirmar clave <span class="text-rose-500">*</span></span>
          <input type="password" formControlName="confirmacionClave" class="h-11 rounded-xl border border-border bg-white px-4 text-sm text-primary outline-none transition focus:border-accent" />
          @if (form.controls.confirmacionClave.touched && form.controls.confirmacionClave.hasError('mismatch')) {
            <span class="text-xs text-rose-600">Las claves no coinciden.</span>
          }
        </label>

        <div class="flex items-center justify-end gap-3 border-t border-slate-200 pt-4">
          <app-ui-button type="button" variant="secondary" (click)="close()" [disabled]="isSaving()">Cancelar</app-ui-button>
          <app-ui-button type="submit" [disabled]="isSaving()">{{ isSaving() ? 'Subiendo...' : 'Subir certificado' }}</app-ui-button>
        </div>
      </form>
    </div>
  </div>
</div>
