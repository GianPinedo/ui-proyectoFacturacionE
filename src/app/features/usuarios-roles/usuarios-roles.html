<section class="space-y-6">
	<div class="flex flex-col gap-3 md:flex-row md:items-start md:justify-between">
		<app-page-title [title]="title" [subtitle]="subtitle" />
		<app-ui-button>Nuevo</app-ui-button>
	</div>

	<app-ui-card>
		<form class="grid gap-4 md:grid-cols-[1fr_220px_auto_auto] md:items-end" [formGroup]="filtersForm" (ngSubmit)="onSearch()">
			<label class="flex flex-col gap-2">
				<span class="text-sm font-medium text-primary">Buscar</span>
				<input
					formControlName="buscar"
					placeholder="Nombre, usuario o correo"
					class="h-11 rounded-xl border border-border bg-white px-4 text-sm text-primary outline-none transition placeholder:text-muted/70 focus:border-accent"
				/>
			</label>

			<label class="flex flex-col gap-2">
				<span class="text-sm font-medium text-primary">Rol</span>
				<select
					formControlName="rol"
					class="h-11 rounded-xl border border-border bg-white px-4 text-sm text-primary outline-none transition focus:border-accent"
				>
					<option value="">Todos</option>
					@for (rol of roles; track rol) {
						<option [value]="rol">{{ rol }}</option>
					}
				</select>
			</label>

			<app-ui-button type="submit" [disabled]="isLoading()" title="Buscar" aria-label="Buscar">
				Buscar  <lucide-angular [img]="searchIcon" [size]="18" /> 
			</app-ui-button>
			<app-ui-button type="button" variant="secondary" [disabled]="isLoading()" (click)="clearFilters()">Limpiar</app-ui-button>
		</form>
	</app-ui-card>

	<app-ui-card>
		<app-ui-table
			[columns]="columns"
			[rows]="rows()"
			[loading]="isLoading()"
			[skeletonRows]="skeletonRows"
			statusColumnKey="estado"
			emptyLabel="No se encontraron usuarios."
		/>

		<app-ui-pagination
			[page]="pagination().page"
			[totalPages]="pagination().totalPages"
			[total]="pagination().total"
			[pageSize]="filtersForm.controls.pageSize.value"
			[pageSizeOptions]="pageSizeOptions"
			[loading]="isLoading()"
			(pageChange)="goToPage($event)"
			(pageSizeChange)="onPageSizeChange($event)"
		/>
	</app-ui-card>
</section>
