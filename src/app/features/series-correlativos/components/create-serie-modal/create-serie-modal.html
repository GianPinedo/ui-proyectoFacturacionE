<div class="fixed inset-0 z-50 flex items-start justify-center overflow-y-auto bg-black/45 p-4 md:items-center" (click)="close()">
  <div class="my-4 w-full max-w-5xl" (click)="$event.stopPropagation()" role="dialog" aria-modal="true" [attr.aria-label]="isEditMode() ? 'Editar serie' : 'Crear serie'">
    <div class="flex max-h-[calc(100vh-2rem)] flex-col overflow-hidden rounded-3xl border border-border bg-[#EEF2F3] shadow-xl">
      <div class="flex items-start justify-between gap-4 border-b border-slate-200 bg-white px-6 py-5 md:px-8">
        <div>
          <h3 class="text-2xl font-extrabold text-primary">{{ isEditMode() ? 'Editar serie' : 'Nueva serie' }}</h3>
        </div>
        <button
          type="button"
          class="inline-flex h-10 w-10 items-center justify-center rounded-xl text-slate-500 transition hover:bg-slate-200"
          (click)="close()"
          aria-label="Cerrar"
          title="Cerrar"
        >
          <lucide-angular [img]="closeIcon" [size]="20" />
        </button>
      </div>

      <form class="grid gap-5 overflow-y-auto p-6 md:grid-cols-2 md:p-8" [formGroup]="form" (ngSubmit)="submit()">
        @if (isLoadingInitialData()) {
          @for (_ of [1, 2, 3, 4]; track $index) {
            <div class="flex flex-col gap-2">
              <div class="h-5 w-32 animate-pulse rounded bg-slate-200"></div>
              <app-skeleton height="md" />
            </div>
          }
        } @else {
          <label class="flex flex-col gap-2">
            <span class="text-sm font-semibold text-slate-700">Tipo de comprobante <span class="text-rose-500">*</span></span>
            <select
              formControlName="tipoComprobante"
              class="h-12 rounded-2xl border border-border bg-white px-4 text-base text-primary outline-none transition focus:border-accent"
            >
              <option value="" disabled>Seleccionar tipo</option>
              @for (option of tipoComprobanteOptions; track option.value) {
                <option [value]="option.value">{{ option.label }}</option>
              }
            </select>
          </label>

          <label class="flex flex-col gap-2">
            <span class="text-sm font-semibold text-slate-700">Serie <span class="text-rose-500">*</span></span>
            <input
              formControlName="serie"
              maxlength="10"
              placeholder="F001"
              class="h-12 rounded-2xl border border-border bg-white px-4 text-base uppercase text-primary outline-none transition placeholder:text-slate-400 focus:border-accent"
            />
            @if (form.controls.serie.touched && form.controls.serie.invalid) {
              <p class="text-sm font-medium text-rose-600">La serie solo debe contener letras y números, hasta 10 caracteres.</p>
            }
          </label>

          <label class="flex flex-col gap-2">
            <span class="text-sm font-semibold text-slate-700">Correlativo actual <span class="text-rose-500">*</span></span>
            <input
              formControlName="correlativoActual"
              type="number"
              min="0"
              step="1"
              placeholder="0"
              class="h-12 rounded-2xl border border-border bg-white px-4 text-base text-primary outline-none transition placeholder:text-slate-400 focus:border-accent"
            />
          </label>

          <label class="flex flex-col gap-2">
            <span class="text-sm font-semibold text-slate-700">Descripción</span>
            <input
              formControlName="descripcion"
              maxlength="150"
              placeholder="Serie principal para factura electrónica"
              class="h-12 rounded-2xl border border-border bg-white px-4 text-base text-primary outline-none transition placeholder:text-slate-400 focus:border-accent"
            />
          </label>
        }

        <div class="flex items-center justify-end gap-3 border-t border-slate-200 pt-5 md:col-span-2">
          <div class="flex items-center gap-3">
            <app-ui-button type="button" variant="secondary" (click)="close()" [disabled]="isSaving() || isLoadingInitialData()">Cancelar</app-ui-button>
            <app-ui-button type="submit" [disabled]="form.invalid || isSaving() || isLoadingInitialData()">
              {{ isSaving() ? 'Guardando...' : (isEditMode() ? 'Guardar cambios' : 'Guardar serie') }}
            </app-ui-button>
          </div>
        </div>
      </form>
    </div>
  </div>
</div>
