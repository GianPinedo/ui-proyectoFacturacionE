<section class="space-y-6">
  <div class="flex flex-col gap-3 md:flex-row md:items-start md:justify-between">
    <app-page-title [title]="title" [subtitle]="subtitle" />
    <app-ui-button type="button" (click)="openCreateSerieForm()">Nueva serie</app-ui-button>
  </div>

  @if (isModalOpen()) {
    <app-create-serie-modal
      [mode]="modalMode()"
      [initialData]="modalInitialData()"
      [isSaving]="isSaving()"
      [isLoadingInitialData]="isLoadingInitialData()"
      (cancelRequested)="closeSerieForm()"
      (saveRequested)="submitSerie($event)"
    />
  }

  <app-ui-card>
    <form class="grid gap-4 md:grid-cols-[240px_160px_180px_auto_auto] md:items-end" [formGroup]="filtersForm" (ngSubmit)="onSearch()">
      <label class="flex flex-col gap-2">
        <span class="text-sm font-medium text-primary">Tipo de comprobante</span>
        <select
          formControlName="tipoComprobante"
          class="h-11 rounded-xl border border-border bg-white px-4 text-sm text-primary outline-none transition focus:border-accent"
        >
          <option value="">Todos</option>
          @for (option of tipoComprobanteOptions; track option.value) {
            <option [value]="option.value">{{ option.label }}</option>
          }
        </select>
      </label>

      <label class="flex flex-col gap-2">
        <span class="text-sm font-medium text-primary">Serie</span>
        <input
          formControlName="serie"
          placeholder="F001"
          class="h-11 rounded-xl border border-border bg-white px-4 text-sm uppercase text-primary outline-none transition placeholder:text-muted/70 focus:border-accent"
        />
      </label>

      <label class="flex flex-col gap-2">
        <span class="text-sm font-medium text-primary">Estado</span>
        <select
          formControlName="estado"
          class="h-11 rounded-xl border border-border bg-white px-4 text-sm text-primary outline-none transition focus:border-accent"
        >
          <option value="">Todos</option>
          <option value="ACTIVO">Activo</option>
          <option value="INACTIVO">Inactivo</option>
        </select>
      </label>

      <app-ui-button type="submit" [disabled]="isLoading()" title="Buscar" aria-label="Buscar">
        Buscar <lucide-angular [img]="searchIcon" [size]="18" />
      </app-ui-button>
      <app-ui-button type="button" variant="secondary" [disabled]="isLoading()" (click)="clearFilters()">Limpiar</app-ui-button>
    </form>
  </app-ui-card>

  <app-ui-card>
    <app-ui-table
      [columns]="columns"
      [rows]="rows()"
      [loading]="isLoading()"
      [skeletonRows]="skeletonRows"
      [showActions]="true"
      [showEditAction]="true"
      [showResetPasswordAction]="false"
      [showDisableAccessAction]="true"
      [showDeleteAction]="true"
      deleteActionLabel="Eliminar serie"
      actionsColumnKey="acciones"
      statusColumnKey="estado"
      emptyLabel="No se encontraron series."
      (editRequested)="onEditRequested($event)"
      (disableAccessRequested)="onDisableAccessRequested($event)"
      (deleteRequested)="onDeleteRequested($event)"
    />

    <app-ui-pagination
      [page]="pagination().page"
      [totalPages]="pagination().totalPages"
      [total]="pagination().total"
      [pageSize]="filtersForm.controls.pageSize.value"
      [pageSizeOptions]="pageSizeOptions"
      [loading]="isLoading()"
      (pageChange)="goToPage($event)"
      (pageSizeChange)="onPageSizeChange($event)"
    />
  </app-ui-card>
</section>
