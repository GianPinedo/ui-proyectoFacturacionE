<section class="space-y-6">
	<app-page-title [title]="title" [subtitle]="subtitle" />

	<app-ui-card>
		<form class="grid gap-4 md:grid-cols-12" [formGroup]="filtersForm" (ngSubmit)="onSearch()">
			<label class="flex flex-col gap-2 md:col-span-3">
				<span class="text-sm font-medium text-primary">Acción</span>
				<select
					formControlName="accion"
					class="h-11 rounded-xl border border-border bg-white px-4 text-sm text-primary outline-none transition focus:border-accent"
				>
					<option value="">Todas</option>
					@for (accion of accionOptions; track accion) {
						<option [value]="accion">{{ accion }}</option>
					}
				</select>
			</label>

			<label class="flex flex-col gap-2 md:col-span-9">
				<span class="text-sm font-medium text-primary">Usuario</span>
				<div class="flex gap-2">
					<input
						type="text"
						[readonly]="true"
						[value]="selectedUsuarioLabel()"
						class="h-11 flex-1 rounded-xl border border-border bg-white px-4 text-sm text-primary outline-none transition focus:border-accent"
						placeholder="Todos"
					/>
					<app-ui-button type="button" variant="secondary" [disabled]="isLoading()" (click)="openUserPicker()">
						Buscar
					</app-ui-button>
					<app-ui-button
						type="button"
						variant="secondary"
						[disabled]="isLoading() || !filtersForm.controls.idUsuario.value"
						(click)="clearSelectedUsuario()"
					>
						X
					</app-ui-button>
				</div>
			</label>

			<label class="flex flex-col gap-2 md:col-span-4">
				<span class="text-sm font-medium text-primary">Fecha desde</span>
				<input
					type="datetime-local"
					formControlName="fechaDesde"
					class="h-11 rounded-xl border border-border bg-white px-4 text-sm text-primary outline-none transition focus:border-accent"
				/>
			</label>

			<label class="flex flex-col gap-2 md:col-span-4">
				<span class="text-sm font-medium text-primary">Fecha hasta</span>
				<input
					type="datetime-local"
					formControlName="fechaHasta"
					class="h-11 rounded-xl border border-border bg-white px-4 text-sm text-primary outline-none transition focus:border-accent"
				/>
			</label>

			<app-ui-button class="md:col-span-2 md:self-end" type="submit" [disabled]="isLoading()" title="Buscar" aria-label="Buscar">
				Buscar <lucide-angular [img]="searchIcon" [size]="18" />
			</app-ui-button>

			<app-ui-button class="md:col-span-2 md:self-end" type="button" variant="secondary" [disabled]="isLoading()" (click)="clearFilters()">
				Limpiar
			</app-ui-button>
		</form>
	</app-ui-card>

	<app-ui-card>
		<app-ui-table
			[columns]="columns"
			[rows]="rows()"
			[loading]="isLoading()"
			[skeletonRows]="skeletonRows"
			[showActions]="false"
			emptyLabel="No se encontraron registros de auditoría."
		/>

		<app-ui-pagination
			[page]="pagination().page"
			[totalPages]="pagination().totalPages"
			[total]="pagination().total"
			[pageSize]="filtersForm.controls.pageSize.value"
			[pageSizeOptions]="pageSizeOptions"
			[loading]="isLoading()"
			(pageChange)="goToPage($event)"
			(pageSizeChange)="onPageSizeChange($event)"
		/>
	</app-ui-card>
</section>

@if (isUserPickerOpen()) {
	<div class="fixed inset-0 z-50 flex items-start justify-center bg-black/50 p-4 md:items-center" (click)="closeUserPicker()">
		<div class="my-4 w-full max-w-5xl rounded-2xl bg-white p-6 shadow-lg" (click)="$event.stopPropagation()" role="dialog" aria-modal="true" aria-label="Seleccionar usuario">
			<div class="mb-4 flex items-center justify-between">
				<div>
					<h3 class="text-lg font-semibold text-primary">Seleccionar usuario</h3>
					<p class="text-sm text-muted">Busca y selecciona un usuario para filtrar auditoría.</p>
				</div>
				<app-ui-button type="button" variant="secondary" (click)="closeUserPicker()">Cerrar</app-ui-button>
			</div>

			<form class="mb-4 grid gap-3 md:grid-cols-[1fr_auto_auto] md:items-end" [formGroup]="userPickerForm" (ngSubmit)="searchUserPicker()">
				<label class="flex flex-col gap-2">
					<span class="text-sm font-medium text-primary">Buscar usuario</span>
					<input
						formControlName="buscar"
						class="h-11 rounded-xl border border-border bg-white px-4 text-sm text-primary outline-none transition focus:border-accent"
						placeholder="Nombre, correo o username"
					/>
				</label>
				<app-ui-button type="submit" [disabled]="isUserPickerLoading()">Buscar</app-ui-button>
				<app-ui-button type="button" variant="secondary" [disabled]="isUserPickerLoading()" (click)="clearUserPickerSearch()">Limpiar</app-ui-button>
			</form>

			<app-ui-table
				[columns]="userColumns"
				[rows]="userPickerRows()"
				[loading]="isUserPickerLoading()"
				[skeletonRows]="6"
				[rowClickable]="true"
				[showActions]="false"
				statusColumnKey="estado"
				emptyLabel="No se encontraron usuarios."
				(rowClicked)="onUserSelected($event)"
			/>

			<app-ui-pagination
				[page]="userPickerPagination().page"
				[totalPages]="userPickerPagination().totalPages"
				[total]="userPickerPagination().total"
				[pageSize]="userPickerForm.controls.pageSize.value"
				[pageSizeOptions]="userPickerPageSizeOptions"
				[loading]="isUserPickerLoading()"
				(pageChange)="goToUserPickerPage($event)"
				(pageSizeChange)="onUserPickerPageSizeChange($event)"
			/>
		</div>
	</div>
}
