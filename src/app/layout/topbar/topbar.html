<header class="sticky top-0 z-20 flex h-[72px] items-center justify-end border-b border-border bg-white px-5 md:px-7">
	<button
		type="button"
		class="mr-auto inline-flex h-10 w-10 items-center justify-center rounded-xl border border-border text-primary transition hover:bg-page lg:hidden"
		(click)="openMenu()"
		aria-label="Abrir menú"
		title="Abrir menú"
	>
		<lucide-angular [img]="menuIcon" [size]="18" />
	</button>

	<app-user-menu (profileRequested)="openProfile()" (logoutRequested)="logout()" />
</header>
