<div class="flex h-screen bg-page">
	<app-sidebar
		[isMobileOpen]="isSidebarOpen"
		(closeRequested)="closeSidebar()"
		(collapsedChanged)="onSidebarCollapsedChanged($event)"
	/>

	@if (isSidebarOpen) {
		<button
			type="button"
			class="fixed inset-0 z-30 bg-black/40 lg:hidden"
			(click)="closeSidebar()"
			aria-label="Cerrar menú"
		></button>
	}

	<div
		class="admin-layout-content ml-0 flex min-w-0 flex-1 flex-col transition-all duration-200"
		[style.--sidebar-offset.px]="isSidebarCollapsed ? 80 : 280"
	>
		<app-topbar (menuRequested)="toggleSidebar()" />

		<main class="min-h-0 flex-1 overflow-y-auto p-5 md:p-7">
			<router-outlet />
		</main>
	</div>
</div>
