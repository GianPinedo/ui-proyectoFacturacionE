<div class="flex h-screen bg-page">
	<app-sidebar
		[isMobileOpen]="isSidebarOpen"
		(closeRequested)="closeSidebar()"
		(collapsedChanged)="onSidebarCollapsedChanged($event)"
		(menuReady)="onSidebarMenuReady()"
	/>

	@if (isSidebarOpen) {
		<button
			type="button"
			class="fixed inset-0 z-30 bg-black/40 lg:hidden"
			(click)="closeSidebar()"
			aria-label="Cerrar menú"
		></button>
	}

	<div
		class="admin-layout-content ml-0 flex min-w-0 flex-1 flex-col"
		[style.--sidebar-offset.px]="isSidebarCollapsed ? 80 : 280"
	>
		<app-topbar (menuRequested)="toggleSidebar()" />

		<main class="min-h-0 flex-1 overflow-y-auto p-5 md:p-7">
			<router-outlet />
		</main>
	</div>

	@if (isBootstrapping) {
		<div class="fixed inset-0 z-[100] flex items-center justify-center bg-white/95">
			<div class="flex flex-col items-center gap-4">
				<div class="flex items-center gap-3">
					<div class="flex h-12 w-12 items-center justify-center rounded-full bg-primary text-base font-bold text-white">EF</div>
					<div>
						<p class="text-lg font-semibold text-primary">E-Factzy</p>
						<p class="text-sm font-medium text-accent">Perú</p>
					</div>
				</div>
				<div class="h-14 w-14 animate-spin rounded-full border-4 border-slate-200 border-t-accent"></div>
				<p class="text-sm font-medium text-primary">Cargando datos iniciales...</p>
			</div>
		</div>
	}
</div>
