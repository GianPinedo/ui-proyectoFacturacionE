<aside
	class="fixed left-0 top-0 z-40 flex h-screen shrink-0 flex-col overflow-visible border-r border-white/10 bg-primary-dark text-white transition-all duration-200 lg:translate-x-0"
	[class.-translate-x-full]="!isMobileOpen"
	[class.translate-x-0]="isMobileOpen"
	[class.w-[280px]]="!isCollapsed()"
	[class.w-20]="isCollapsed()"
>
	<div class="flex items-center justify-between px-6 py-6">
		@if (!isCollapsed()) {
			<div class="flex items-center gap-3 flex-1">
				<div class="flex h-12 w-12 items-center justify-center rounded-xl bg-white/15 text-base font-bold text-white">EF</div>
				<div>
					<p class="text-lg font-semibold tracking-wide">E-Factzy</p>
					<p class="text-sm font-medium text-accent">Perú</p>
				</div>
			</div>
		} @else {
			<div class="flex h-12 w-12 items-center justify-center rounded-xl bg-white/15 text-base font-bold text-white">EF</div>
		}
		<button
			(click)="toggleCollapse()"
			class="hidden lg:flex items-center justify-center p-2 rounded-lg hover:bg-white/10 transition"
			title="Contraer/expandir menú"
		>
			<lucide-angular [img]="menuIcon" [size]="20" />
		</button>
	</div>

	<nav class="min-h-0 flex-1 space-y-1 overflow-visible px-4 pb-6">
		@for (item of menuItems; track item.path) {
			<a
				[routerLink]="item.path"
				(click)="closeOnMobile()"
				routerLinkActive
				#rla="routerLinkActive"
				[class.bg-[#07594f]]="rla.isActive"
				[class.text-white]="rla.isActive"
				class="group relative flex items-center gap-3 rounded-xl px-4 py-3 text-sm font-medium text-emerald-50/80 transition hover:bg-white/10 hover:text-white"
				[attr.title]="isCollapsed() ? item.label : null"
			>
				<lucide-angular [img]="item.icon" [size]="18" class="text-emerald-100/80 transition flex-shrink-0" [class.text-accent]="rla.isActive" />
				@if (!isCollapsed()) {
					<span class="flex-1">{{ item.label }}</span>
					<span class="h-2 w-2 rounded-full bg-accent opacity-0 transition" [class.opacity-100]="rla.isActive"></span>
				} @else {
					<span
						class="pointer-events-none absolute left-full top-1/2 z-50 ml-2 -translate-y-1/2 translate-x-1 whitespace-nowrap rounded-lg border border-white/10 bg-primary-dark px-3 py-2 text-xs font-semibold text-white opacity-0 shadow-xl transition-all duration-150 group-hover:translate-x-0 group-hover:opacity-100"
					>
						{{ item.label }}
					</span>
				}
			</a>
		}
	</nav>
</aside>
